# Runtime extras config for gokrazy-router.
# Place this on the mounted disk as /mnt/data/router-extras.toml and
# configure services.extrasFile to point to it.
#
# This file is re-read on every gokrazy router restart, so changes to
# reservations, PXE images, and DNS take effect without redeploying.
# POST /api/reload (Authorization: Bearer <token>, see services.adminAPI)
# applies reservations + PXE settings + DNS live without a restart.
# Changes to [vlanAddresses] and [[smbUsers]] require a router restart and are
# rejected by /api/reload with HTTP 409.

# VLAN address overrides (VLAN ID -> CIDR). Applied on router startup.
[vlanAddresses]
31 = "10.0.31.129/25"

# Static DHCP reservations (MAC -> IP). Only applied to the matching subnet.
[reservations]
"5c:ff:35:0d:b3:49" = "10.0.31.150"

# DNS servers for all DHCP scopes. Overrides the base config dns field.
# Up to 3 servers: primary, secondary, tertiary.
dns = ["1.1.1.1", "8.8.8.8", "1.0.0.1"]

# Per-MAC PXE image file name. The requested TFTP filename is matched
# against the client MAC address. This is the ONLY way to give a client a
# non-default boot flow: the ThinkPad T410i and Fujitsu Esprimo (legacy BIOS)
# get the iPXE chain (undionly.kpxe -> boot.ipxe -> netboot.xyz).
# Everything else defaults to the UEFI bootloader netboot.xyz.efi.
[macImages]
"5c:ff:35:0d:b3:49" = "undionly.kpxe"
"82:78:97:41:e1:db" = "netboot.xyz.img"
"16:7e:67:eb:ac:e1" = "undionly.kpxe"
"90:1b:0e:3e:ba:d6" = "netboot.xyz.efi"

# PXE boot file selection. These override the global services.pxe defaults.
# Default boot file is the UEFI netboot.xyz.efi. Legacy-BIOS PXE clients
# (no DHCP option 93) get undionly.kpxe so they chain iPXE ->
# boot.ipxe -> netboot.xyz menu (validated on ThinkPad T410i and
# Fujitsu Esprimo legacy clients).
pxeBootFile = "netboot.xyz.efi"
legacyBootFile = "undionly.kpxe"
uefiBootFile = "netboot.xyz.efi"
ipxeScript = "boot.ipxe"
