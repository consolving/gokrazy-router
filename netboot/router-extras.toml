# Runtime extras config for gokrazy-router.
# Place this on the mounted disk as /mnt/data/router-extras.toml and
# configure services.extrasFile to point to it.
#
# This file is re-read on every gokrazy router restart, so changes to
# reservations, PXE images, and boot files take effect without redeploying.
# POST /api/reload (Authorization: Bearer <token>, see services.adminAPI)
# applies reservations + PXE settings live without a restart. Changes to
# [vlanAddresses] and [[smbUsers]] require a router restart and are
# rejected by /api/reload with HTTP 409.

# Static DHCP reservations (MAC -> IP). Only applied to the matching subnet.
[reservations]
"5c:ff:35:0d:b3:49" = "10.0.31.150"

# Per-MAC PXE image file name. The requested TFTP filename is matched
# against the client MAC address. This is the ONLY way to give a client a
# non-default boot flow: the ThinkPad T410i (legacy BIOS) is the only client
# that should get the iPXE chain (undionly.kpxe -> boot.ipxe -> netboot.xyz).
# Everything else defaults to the UEFI bootloader netboot.xyz.efi.
[macImages]
"5c:ff:35:0d:b3:49" = "undionly.kpxe"

# PXE boot file selection. These override the global services.pxe defaults.
# Default boot file is the UEFI netboot.xyz.efi; legacy-BIOS clients without
# a MAC entry get the same boot file (no iPXE chain for them).
pxeBootFile = "netboot.xyz.efi"
legacyBootFile = "netboot.xyz.efi"
uefiBootFile = "netboot.xyz.efi"
ipxeScript = "boot.ipxe"
